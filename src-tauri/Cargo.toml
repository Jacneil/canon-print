[package]
name = "chibishotsprint"
version = "0.1.0"
description = "ChibishotsPrint - print companion for Canon PIXMA PRO-100S"
authors = ["Chibishots"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chibishotsprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
# Color management
lcms2 = "6"
# Image processing
image = { version = "0.25", features = ["tiff", "png", "jpeg"] }
# Printing (Windows spooler via raw FFI later; cross-platform abstraction)
# Create PDFs for print pipelines / export
printpdf = "0.7"
# PDF rendering: render PDF pages to images for the print pipeline
pdfium-render = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]