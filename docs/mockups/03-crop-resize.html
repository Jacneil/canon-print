<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Image crop / resize / rotate</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><img src="../../chibishots%20logo-UPSCALED.png" alt="Chibishots logo" /></div>
    <div class="navbtn">Print</div>
    <div class="navbtn active">Edit</div>
    <div class="navbtn">Queue</div>
    <div class="navbtn">Sets</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1>Crop / resize / rotate</h1>
      <span class="spacer"></span>
      <button class="btn">Reset</button>
      <button class="btn primary">Apply</button>
    </header>
    <div class="content">
      <section class="canvas">
        <div class="cropbox">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='360'><rect width='100%' height='100%' fill='%23333'/><text x='50%' y='50%' fill='%23aaa' text-anchor='middle' font-size='20'>Source image</text></svg>" alt="img" />
          <div class="handle tl"></div><div class="handle tr"></div>
          <div class="handle bl"></div><div class="handle br"></div>
        </div>
      </section>
      <aside class="panel">
        <h2>Transform</h2>
        <div class="row" style="margin-bottom:12px;">
          <button class="btn">Rotate L</button>
          <button class="btn">Rotate R</button>
          <button class="btn">Flip H</button>
          <button class="btn">Flip V</button>
        </div>
        <div class="field"><label>Rotation (°)</label><input value="0" type="number" /></div>
        <h2>Crop</h2>
        <div class="grid2">
          <div class="field"><label>X (px)</label><input value="120" /></div>
          <div class="field"><label>Y (px)</label><input value="80" /></div>
          <div class="field"><label>Width (px)</label><input value="2400" /></div>
          <div class="field"><label>Height (px)</label><input value="1800" /></div>
        </div>
        <div class="field"><label>Aspect lock</label><select><option>Free</option><option>4:3</option><option>3:2</option><option>16:9</option><option>1:1</option></select></div>
        <h2>Resize / resample</h2>
        <div class="grid2">
          <div class="field"><label>Width (px)</label><input value="2400" /></div>
          <div class="field"><label>Height (px)</label><input value="1800" /></div>
        </div>
        <div class="field"><label>Resample</label><select><option>Lanczos3</option><option>Bicubic</option><option>Bilinear</option><option>Nearest</option></select></div>
        <div class="field"><label>Output DPI</label><input value="300" /></div>
        <div class="card">
          <strong>Result:</strong> 2400×1800 px @ 300 dpi → 8×6 in
        </div>
      </aside>
    </div>
  </main>
</div>
</body>
</html>
