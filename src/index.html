<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ChibishotsPrint</title>
<link rel="stylesheet" href="../docs/mockups/styles.css" />
<style>
  body { overflow:hidden; }
  .layout { display:grid; grid-template-columns: 72px 1fr; height:100vh; }
  .main2 { display:flex; flex-direction:column; overflow:hidden; }
  .view { flex:1; padding:24px; overflow:auto; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .job { padding:10px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--panel2); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo"><img src="../chibishots%20logo-UPSCALED.png" alt="Chibishots" /></div>
    <div class="navbtn active" data-view="print">Print</div>
    <div class="navbtn" data-view="presets">Presets</div>
    <div class="navbtn" data-view="queue">Queue</div>
    <div class="navbtn" data-view="history">History</div>
  </aside>
  <main class="main2">
    <header class="topbar">
      <h1>ChibishotsPrint</h1>
      <span class="spacer"></span>
      <button class="btn" id="openBtn">Open image…</button>
      <button class="btn primary" id="printBtn">Send to spooler</button>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<script>
  const invoke = (cmd, args) => window.__TAURI__ ? window.__TAURI__.core.invoke(cmd, args) : Promise.reject('no tauri');
  const view = document.getElementById('view');
  function showPrint() {
    view.innerHTML = '<h2>Print</h2><p>Select an image and a preset, then send to spooler.</p>' +
      '<div style="margin:12px 0;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--panel2)">' +
      '<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><input type="checkbox" id="upscaleToggle" checked> Upscale small images automatically</label>' +
      '<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><input type="checkbox" id="upscaleForce"> Force upscale selected image</label>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">' +
      '<label>Scale: <select id="upscaleScale"><option value="2">2x</option><option value="4">4x</option></select></label>' +
      '<label><input type="checkbox" id="upscaleSharpen" checked> Sharpen</label>' +
      '<label>Min edge px: <input id="upscaleMin" type="number" value="1200" style="width:80px"></label>' +
      '</div>' +
      '<div id="upscaleProgress" style="display:none;margin-top:8px;">' +
      '<div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;"><div id="upscaleProgressBar" style="height:100%;width:0%;background:var(--accent,#f97316);transition:width .2s"></div></div>' +
      '<div id="upscaleProgressText" style="font-size:12px;color:var(--muted);margin-top:4px;">Idle</div>' +
      '</div>' +
      '</div>' +
      '<div id="status"></div>';
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen('upscale-progress', (e) => {
        const d = e.payload || {};
        const bar = document.getElementById('upscaleProgressBar');
        const txt = document.getElementById('upscaleProgressText');
        const box = document.getElementById('upscaleProgress');
        if (!bar) return;
        box.style.display = 'block';
        bar.style.width = Math.round((d.progress||0)*100)+'%';
        txt.innerText = (d.stage||'') + ' ' + Math.round((d.progress||0)*100)+'%';
        if (d.stage === 'done') setTimeout(()=>{ box.style.display='none'; }, 1200);
      });
    }
  }
  function showPresets() {
    invoke('list_presets').then(ps => {
      view.innerHTML = '<h2>Presets</h2>' + ps.map(p => `<div class="card"><strong>${p.name}</strong><br><span style="color:var(--muted);font-size:12px;">${p.media_type} · ${p.icc_profile} · ${p.rendering_intent}</span></div>`).join('');
    }).catch(e => view.innerHTML = '<p>'+e+'</p>');
  }
  function showQueue() {
    invoke('queue_status').then(js => {
      view.innerHTML = '<h2>Queue</h2>' + (js.length? js.map(j => `<div class="job"><strong>${j.file}</strong> — ${j.status}<br><span style="color:var(--muted);font-size:12px;">${j.preset} · ${j.submitted_at}</span><br><button class="btn" onclick="cancel('${j.id}')">Cancel</button> <button class="btn primary" onclick="retry('${j.id}')">Retry</button></div>`).join('') : '<p style="color:var(--muted)">No active jobs.</p>');
    }).catch(e => view.innerHTML = '<p>'+e+'</p>');
  }
  function showHistory() {
    invoke('job_history').then(js => {
      view.innerHTML = '<h2>History</h2>' + (js.length? js.map(j => `<div class="job">${j.submitted_at} — ${j.file} — ${j.preset} — ${j.notes}</div>`).join('') : '<p style="color:var(--muted)">No history yet.</p>');
    }).catch(e => view.innerHTML = '<p>'+e+'</p>');
  }
  window.cancel = id => invoke('cancel_job',{id}).then(()=>showQueue());
  window.retry = id => invoke('retry_job',{id}).then(()=>showQueue());
  document.querySelectorAll('.navbtn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const v = b.dataset.view;
    if (v==='print') showPrint();
    if (v==='presets') showPresets();
    if (v==='queue') showQueue();
    if (v==='history') showHistory();
  }));
  showPrint();
  invoke('greet').then(m => console.log(m)).catch(()=>{});
  document.getElementById('openBtn').addEventListener('click', async () => {
    if (window.__TAURI__ && window.__TAURI__.dialog) {
      const p = await window.__TAURI__.dialog.open({ filters:[{name:'Images',extensions:['tif','tiff','png','jpg','jpeg']}] });
      if (p) { window.__selectedFile = p; document.getElementById('status').innerText = 'Selected: '+p; }
    } else {
      document.getElementById('status').innerText = 'File picker unavailable (dev)';
    }
  });
  document.getElementById('printBtn').addEventListener('click', async () => {
    const f = window.__selectedFile || 'sample.tif';
    const toggle = document.getElementById('upscaleToggle');
    const force = document.getElementById('upscaleForce');
    const scale = parseInt(document.getElementById('upscaleScale').value||'2',10);
    const sharpen = document.getElementById('upscaleSharpen').checked;
    const minEdge = parseInt(document.getElementById('upscaleMin').value||'1200',10);
    let fileToPrint = f;
    try {
      fileToPrint = await invoke('prepare_print_image', {
        path: f,
        upscaleEnabled: !!(force && force.checked),
        autoSmall: !!(toggle && toggle.checked),
        minEdgePx: minEdge,
        scale: scale,
        sharpen: sharpen
      });
    } catch (e) { console.warn('upscale skipped', e); }
    await invoke('submit_print',{file:fileToPrint, preset:'Luster 13x19', notes:''});
    showQueue();
    document.querySelector('[data-view="queue"]').click();
  });
</script>
</body>
</html>
